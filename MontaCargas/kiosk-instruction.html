<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Continuar en la ventana emergente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }

        .message-box {
            max-width: 420px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
            background: #ffffff;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #ed3131;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="message-box">
    <h1>¡Atención!</h1>
    <p>Trabaje en la pestaña que se abrió de forma automática.<br>
        Puede cerrar esta ventana.</p>
</div>
</body>
</html>
